services:
    laravel.test:
        build:
            context: '.'
            dockerfile: docker/8.4/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.4-octane/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER:-1337}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            DB_HOST: pgsql
            DB_CONNECTION: pgsql
            DB_USERNAME: '${DB_USERNAME:-sail}'
            DB_PASSWORD: '${DB_PASSWORD:-password}'
            REDIS_HOST: redis
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            LOG_STACK: 'daily,stderr,syslog'
            LOG_STDERR_LEVEL: debug
        ports:
            - '${APP_PORT:-80}:8000'
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8000/healthz']
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 30s
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
    horizon:
        image: 'sail-8.4-octane/app'
        command: ['php', '/var/www/html/artisan', 'horizon']
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER:-1337}'
            LARAVEL_SAIL: 1
            DB_HOST: pgsql
            DB_CONNECTION: pgsql
            DB_USERNAME: '${DB_USERNAME:-sail}'
            DB_PASSWORD: '${DB_PASSWORD:-password}'
            REDIS_HOST: redis
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            LOG_STACK: 'daily,stderr,syslog'
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
    scheduler:
        image: 'sail-8.4-octane/app'
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER:-1337}'
            LARAVEL_SAIL: 1
            DB_HOST: pgsql
            DB_CONNECTION: pgsql
            DB_USERNAME: '${DB_USERNAME:-sail}'
            DB_PASSWORD: '${DB_PASSWORD:-password}'
            REDIS_HOST: redis
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            LOG_STACK: 'daily,stderr,syslog'
            LOG_STDERR_LEVEL: info
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-laravel}'
                - '-U'
                - '${DB_USERNAME:-sail}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-vendor:
        driver: local
    sail-node-modules:
        driver: local
